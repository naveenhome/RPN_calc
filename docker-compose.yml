services:
  mysql:
    image: mysql:8.4
    container_name: rpn-calc-mysql
    environment:
      MYSQL_DATABASE: rpn_calc
      MYSQL_USER: rpn_user
      MYSQL_PASSWORD: rpn_secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
